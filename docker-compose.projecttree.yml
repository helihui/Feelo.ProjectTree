services:
  projecttree-app:
    image: projecttree:prod
    container_name: projecttree-app
    restart: unless-stopped
    env_file:
      - /opt/projecttree/secrets/app.env
    networks:
      - mcp-hub-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/sign-in').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  mcp-hub-net:
    external: true
